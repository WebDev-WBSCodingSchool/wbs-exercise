# Runs the unit test and the end-to-end test whenever the launcher changes, and
# on demand. There is no schedule: the plugin's release workflow runs the unit
# test against each release before it reaches `stable`, which is the only way
# the plugin can break this launcher. (GitHub would also switch a schedule off
# after 60 days without activity in this repository.)

name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # On Windows, bash is Git Bash, the shell students use there.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # The unit test copies a local plugin checkout instead of using GitHub.
      - uses: actions/checkout@v5
        with:
          repository: WebDev-WBSCodingSchool/claude-code-plugin
          path: plugin

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code

      - name: Unit test
        run: npm test
        env:
          PLUGIN_CHECKOUT: ${{ github.workspace }}/plugin

      - name: End-to-end test
        run: npm run test:e2e
        env:
          E2E_REQUIRE_CLAUDE: "1"
